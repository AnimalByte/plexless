# hts-sys requests libz-sys's `static` feature transitively. Let HTSlib link the
# dynamic system library instead; FASTQ gzip output independently uses flate2's
# zlib-rs backend. libz-sys documents LIBZ_SYS_STATIC as the override for this
# exact transitive-static situation.
[env]
LIBZ_SYS_STATIC = "0"
