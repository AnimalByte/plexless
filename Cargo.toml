[package]
name = "plexless"
version = "0.3.1"
edition = "2024"
description = "High-performance hierarchical FASTQ and unmapped CRAM demultiplexer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AnimalByte/plexless"
readme = "README.md"
keywords = [
    "bioinformatics",
    "fastq",
    "demultiplexing",
    "sequencing",
    "ngs",
]
categories = [
    "command-line-utilities",
    "science",
]
autobins = false

[[bin]]
name = "plexless"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
needletail = { version = "0.7.3", default-features = false, features = ["bzip2", "flate2", "zstd"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib"] }
crossbeam-channel = "0.5"
rapidgzip-core = "0.3.1"
rust-htslib = { version = "1.0.1", default-features = false, features = ["bzip2", "lzma"] }
xz2 = "0.1.7"
libc = "0.2"
