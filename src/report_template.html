<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}}</title>
<style>body{font:16px system-ui,sans-serif;background:#f5f7fa;color:#17283a;margin:0}main{max-width:1100px;margin:auto;padding:32px}h1{font-size:28px}section{background:white;padding:24px;margin:20px 0;border-radius:12px}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:9px;border-bottom:1px solid #e5eaf0}select,button{font:inherit;padding:8px;margin-right:10px}svg{width:100%;height:300px}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#516478}.legend{display:flex;gap:16px;flex-wrap:wrap}</style>
<main><h1>{{TITLE}}</h1><small>Standalone Plexless QC report. All data and charts are embedded; no network access is required.</small>
<section><h2>Processing summary</h2><table id="summary"></table></section>
<section><h2>Duplication</h2><table id="duplication"></table></section>
<section><h2>Quality and base composition by cycle</h2><select id="read"></select><select id="metric"><option value="quality_curves">Mean Phred quality</option><option value="content_curves">Base fraction</option></select><div id="chart"></div><div class="legend" id="legend"></div></section>
<section><h2>Selected read statistics</h2><table id="readsummary"></table></section>
<section><h2>Length distribution</h2><div id="length"></div></section><section><h2>Trimming and filtering</h2><table id="trimming"></table></section>
<section><h2>Sampled overrepresented sequences</h2><pre id="overrep"></pre></section><section><h2>Provenance</h2><pre id="provenance"></pre></section></main>
<script type="application/json" id="data">{{DATA}}</script><script>
'use strict';const d=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);
function table(id,o){const t=$(id);for(const[k,v]of Object.entries(o||{})){if(typeof v==='object'&&!Array.isArray(v))continue;const r=t.insertRow();r.insertCell().textContent=k.replaceAll('_',' ')+(Array.isArray(v)?' (R1 / R2)':'');r.insertCell().textContent=Array.isArray(v)?v.join(' / '):typeof v==='number'?((k==='rate'||k.endsWith('_rate')||k.endsWith('_content'))?(100*v).toFixed(2)+'%':v.toLocaleString()):String(v);}}

table('summary',d.processing);table('duplication',d.duplication);table('trimming',d.trimming);table('trimming',d.filtering_result);$('provenance').textContent=JSON.stringify({tool:d.tool,coordinates:d.input_coordinates,limits:d.report_limits},null,2);$('overrep').textContent=JSON.stringify(d.overrepresented_sequences||{},null,2);
const keys=Object.keys(d).filter(k=>k.includes('_filtering')&&d[k]?.quality_curves);for(const key of keys){const option=document.createElement('option');option.value=key;option.textContent=key.replaceAll('_',' ');$('read').append(option);}
const colors=['#2463eb','#e68a00','#089778','#be3aa8','#65758b','#c33333','#17283a'];
function draw(target,series,maxY){const root=$(target);root.replaceChildren();const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 1000 300');svg.setAttribute('role','img');const width=Math.max(1,...Object.values(series).map(v=>v.length));let j=0;
for(const[name,values]of Object.entries(series)){if(!values.length)continue;const p=document.createElementNS(ns,'polyline');p.setAttribute('points',values.map((v,i)=>`${40+940*i/Math.max(1,width-1)},${270-240*v/Math.max(1e-9,maxY)}`).join(' '));p.setAttribute('fill','none');p.setAttribute('stroke',colors[j++%colors.length]);p.setAttribute('stroke-width','2');const title=document.createElementNS(ns,'title');title.textContent=name;p.append(title);svg.append(p);}root.append(svg);}
function refresh(){const row=d[$('read').value];if(!row)return;$('readsummary').replaceChildren();table('readsummary',row.summary);const m=$('metric').value,series=row[m]||{};draw('chart',series,m==='content_curves'?1:Object.values(series).reduce((m,values)=>values.reduce((n,v)=>Math.max(n,v),m),40));$('legend').replaceChildren();let j=0;for(const name of Object.keys(series)){const span=document.createElement('span');span.style.color=colors[j++%colors.length];span.textContent=name;$('legend').append(span);}const lengths=row.length_distribution||[];$('length').textContent=lengths.map(x=>`${x.length} bases: ${x.reads.toLocaleString()} reads`).join(' · ')||'No reads';}
$('read').addEventListener('change',refresh);$('metric').addEventListener('change',refresh);refresh();
</script></html>
